name: iOS diagnostic build

on:
  workflow_dispatch:
  push:
    branches:
      - diagnostics/download-error-codes

permissions:
  contents: read

concurrency:
  group: ios-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-unsigned-ipa:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build unsigned iOS archive
        run: |
          Scripts/configure-ios.sh
          xcodebuild archive \
            -workspace ios/KumoneIOS.xcworkspace \
            -scheme KumoneIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/KumoneIOS.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/KumoneIOS.xcarchive/Products/Applications/KumoneIOS.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$RUNNER_TEMP/KumoneIOS-diagnostic-unsigned.ipa" Payload

      - name: Upload diagnostic IPA
        uses: actions/upload-artifact@v4
        with:
          name: KumoneIOS-diagnostic-unsigned
          path: ${{ runner.temp }}/KumoneIOS-diagnostic-unsigned.ipa
          if-no-files-found: error
